image:
  repository: ghcr.io/rampart-aios/conda-code-server/dev-code-server
  tag: 1.1.2

service:
  type: NodePort

extraVars: 
#  - name: DISABLE_TELEMETRY
#    value: true
  - name: DOCKER_HOST
    value: "tcp://localhost:2375"

# If docker-dind is used, DOCKER_HOST env is mandatory to set in "extraVars"
extraContainers: | 
  - name: docker-dind
    image: docker:27.3.1-dind
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 256M
    securityContext:
      privileged: true
      procMount: Default
    env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
    - name: DOCKER_DRIVER
      value: "overlay2"


extraInitContainers: |
  - name: path-export
    image: ghcr.io/rampart-aios/conda-code-server/cuda-init:{{ .Values.image.tag }}
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        cd && pwd
        if [ ! -d "./miniconda3" ]; then
          echo "install Miniconda3 and docker"
          bash /downloads/Miniconda3-latest-Linux-x86_64.sh -b
          cp /downloads/.bashrc /home/coder
          echo "conda init"
          ./miniconda3/bin/conda init bash
          echo "initializing home"
          mkdir /home/coder/bin
          echo "install docker"
          tar zxvf /downloads/docker.tgz --strip 1 -C ./bin docker/docker
          echo "install kubectl"
          cp /downloads/kubectl /home/coder/bin
          chmod +x /home/coder/bin/kubectl
          echo "install ollama"
          tar -C /home/coder -xzf /downloads/ollama-linux-amd64.tgz
        fi
        
    volumeMounts:
      - name: data
        mountPath: /home/coder


## Persist data to a persistent volume
persistence:
  enabled: true
  ## code-server data Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  # storageClass: "custom-hostpath-89"
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}
  # existingClaim: ""
  # hostPath: /data
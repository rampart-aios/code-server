---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aios-ide-role
rules:
  - apiGroups: [""] # Core API group
    resources: ["*"] # All core resources (pods, services, configmaps, etc.)
    verbs: ["*"] # Full access (get, list, create, update, delete, etc.)
  - apiGroups: ["apps", "batch"] # Resources from apps and batch APIs
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aios-ide-binding
subjects:
- kind: ServiceAccount
  name: {{ include "code-server.name" . }}
roleRef:
  kind: Role
  name: aios-ide-role
  apiGroup: rbac.authorization.k8s.io
